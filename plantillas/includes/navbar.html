<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=plantillas/categorias.html, initial-scale=1.0"
    />
    <title>Navbar</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/navbar.css') }}"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="{{ url_for('inventario') }}">
          <i class="bi bi-gear-fill"></i>
          Equi-Parts S&S</a
        >
        <div class="navbar-nav me-auto">
          <a
            class="nav-link {% if request.endpoint == 'inventario' %}active{% endif %}"
            href="{{ url_for('inventario') }}"
          >
            Inventario
          </a>
          {% if session['rol'] == 'Administrador' %}
          <a
            class="nav-link {% if request.endpoint == 'categorias' %}active{% endif %}"
            href="{{ url_for('categorias') }}"
          >
            Categorías
          </a>

          <a
            class="nav-link {% if request.endpoint == 'usuarios' %}active{% endif %}"
            href="{{ url_for('usuarios') }}"
          >
            Usuarios
          </a>
          <a
            class="nav-link text-warning {% if request.endpoint == 'auditoria' %}active{% endif %}"
            href="{{ url_for('auditoria') }}"
          >
            Auditoría (Log)
          </a>
          {% endif %}
        </div>
        <form
          class="d-flex me-3"
          action="{{ url_for('inventario') }}"
          method="GET"
        >
          <div class="input-group">
            <input
              class="form-control"
              type="search"
              name="q"
              placeholder="Buscar SKU o Nombre"
              value="{{ busqueda }}"
            />
            <button class="btn btn-outline" type="submit">
              <i class="bi bi-search ms-1"></i>
            </button>
          </div>
        </form>
        <div class="d-flex align-items-center">
          <div class="usuario-panel me-3">
            <i class="bi bi-person-circle"></i>
            <div>
              <div>{{ username }}</div>
              <small>{{ session['rol'] }}</small>
            </div>
          </div>

          <a href="{{ url_for('logout') }}" class="btn btn-danger">
            <i class="bi bi-box-arrow-right me-1"></i>
            Salir
          </a>
        </div>
      </div>
    </nav>
  </body>
</html>
