<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar {{ p.sku }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow mx-auto" style="max-width: 600px;">
            <div class="card-header bg-warning">
                <h4 class="mb-0">Editar Producto: {{ p.sku }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label>Nombre del Repuesto</label>
                        <input type="text" name="nombre" class="form-control" value="{{ p.nombre }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Descripción</label>
                        <textarea name="descripcion" class="form-control">{{ p.descripcion }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label>Precio Unitario ($)</label>
                        <input type="number" step="0.01" name="precio" class="form-control" value="{{ p.precio }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Ubicación Física</label>
                        <input type="text" name="ubicacion" class="form-control" value="{{ p.ubicacion }}">
                    </div>
                    <div class="mb-3">
                        <label>Categoría</label>
                        <select name="categoria_id" class="form-select">
                            <option value="">Sin categoría</option>
                            {% for c in categorias %}
                            <option value="{{ c.id }}" {% if p.categoria_id == c.id %}selected{% endif %}>{{ c.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('inventario') }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
