
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body class="bg-light">
  {% include 'includes/navbar.html' %}
    <div class="container mt-5">
        <div class="card shadow mx-auto" style="max-width: 600px;">
            <div class="card-header bg-warning text-dark fw-semibold">
                <i class="bi bi-person-gear me-2"></i>
                Editar Usuario
            </div>
            <div class="card-body">
                <div class="mb-4">
                    <h4 class="fw-bold mb-1">{{ u.username }}</h4>
                    <span class="badge bg-secondary">
                        Usuario registrado
                    </span>
                    <p class="text-muted mt-2 mb-0">
                        Actualice el rol o la contraseña del usuario.
                    </p>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Nueva Contraseña
                            </label>

                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-key-fill"></i>
                                </span>

                                <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Dejar vacío para mantener la actual"
                                />
                            </div>

                            <small class="text-muted">
                                Si no escribe una contraseña nueva, la actual permanecerá sin cambios.
                            </small>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Rol en el Sistema
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-shield-lock"></i>
                            </span>

                            <select name="rol" class="form-select">
                                <option value="Vendedor" {% if u.rol == 'Vendedor' %}selected{% endif %}>
                                    Vendedor
                                </option>

                                <option value="Bodeguero" {% if u.rol == 'Bodeguero' %}selected{% endif %}>
                                    Bodeguero
                                </option>

                                <option value="Administrador" {% if u.rol == 'Administrador' %}selected{% endif %}>
                                    Administrador
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('usuarios') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left me-1"></i>
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle me-1"></i>
                            Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
