<!DOCTYPE html>
<html lang="es">
<head>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <meta charset="UTF-8">
    <title>Editar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/inventario.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mojave-theme.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/material-expressive.css') }}">
<script defer src="{{ url_for('static', filename='js/validacion-formularios.js') }}"></script>
</head>
<body class="bg-light">
  {% include 'includes/navbar.html' %}
    <div class="container mt-5">
        <div class="card shadow mx-auto" style="max-width: 600px;">
            <div class="card-header d-flex align-items-center gap-2 fw-semibold"><span class="icon-pill sand"><i class="bi bi-person-gear"></i></span><span>Editar Usuario</span></div>
            <div class="card-body">
                <div class="mb-4">
                    <h4 class="fw-bold mb-1">{{ u.username }}</h4>
                    <span class="badge bg-secondary">
                        Usuario registrado
                    </span>
                    <p class="text-muted mt-2 mb-0">
                        Actualice el rol, el correo o la contraseña del usuario.
                    </p>
                </div>
                <form method="POST">
<input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="form-section section-blue mb-3">
                        <label class="field-label form-label"><i class="bi bi-envelope"></i> Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control" value="{{ u.email }}" required>
                        </div>
                    </div>

                    <div class="form-section section-lavender mb-3">
                        <label class="field-label form-label"><i class="bi bi-key"></i> Nueva Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-key-fill"></i>
                            </span>
                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Dejar vacío para mantener la actual"
                            />
                        </div>
                        <small class="text-muted">
                            Si no escribe una contraseña nueva, la actual permanecerá sin cambios.
                        </small>
                    </div>

                    <div class="form-section section-sand mb-3">
                        <label class="field-label form-label"><i class="bi bi-shield-check"></i> Rol en el Sistema</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-shield-lock"></i>
                            </span>

                            <select name="rol" class="form-select">
                                <option value="Vendedor" {% if u.rol == 'Vendedor' %}selected{% endif %}>
                                    Vendedor
                                </option>

                                <option value="Bodeguero" {% if u.rol == 'Bodeguero' %}selected{% endif %}>
                                    Bodeguero
                                </option>

                                <option value="Administrador" {% if u.rol == 'Administrador' %}selected{% endif %}>
                                    Administrador
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('usuarios.usuarios') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left me-1"></i>
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-accent-teal">
                            <i class="bi bi-check-circle me-1"></i>
                            Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
