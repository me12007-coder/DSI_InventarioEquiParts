<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Login - Equi-Parts S&S</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
  </head>
  <body class="login-page">
    <div class="row g-0 vh-100">
      <!-- Mitad Izquierda (Fondo Industrial) -->
      <div class="col-lg-8 d-none d-lg-block bg-login-image">
         <div class="login-overlay">
            <h1 class="text-white fw-bold display-4">REPUESTOS QUE MANTIENEN TU MUNDO EN MOVIMIENTO.</h1>
         </div>
      </div>

      <!-- Mitad Derecha (Formulario) -->
      <div class="col-lg-4 d-flex align-items-center justify-content-center bg-fondo">
        <div class="card p-5 shadow-lg border-0" style="width: 28rem; border-radius: 12px; background-color: #FFFFFF;">
          <div class="logo">
            <i class="bi bi-gear-fill"></i>
          </div>
          <h3 class="text-center fw-bold mt-2" style="color: #1C252C;">Equi-Parts S&S</h3>
          <p class="text-center mb-4" style="color: #6B7785;">Sistema de Gestión de Repuestos</p>

          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form method="POST">
            <div class="mb-3">
              <label class="form-label fw-bold" style="color: #20252B;">Usuario</label>
              <div class="input-group">
                <span class="input-group-text bg-secundario text-white border-0"><i class="bi bi-person-fill"></i></span>
                <input type="text" name="username" class="form-control bg-light" placeholder="Ingresa tu usuario" required />
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-bold" style="color: #20252B;">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text bg-secundario text-white border-0"><i class="bi bi-lock-fill"></i></span>
                <input type="password" id="password" name="password" class="form-control bg-light" placeholder="Ingresa tu contraseña" required />
                <button class="btn btn-outline-secondary" type="button" onclick="mostrarPassword()">
                  <i class="bi bi-eye-fill"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 fs-5">
              Iniciar Sesión
            </button>
          </form>
        </div>
      </div>
    </div>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
  </body>
</html>
