<!-- Botón hamburguesa para móviles (solo visible en pantallas pequeñas) -->
<button class="btn d-lg-none m-3 position-fixed top-0 start-0 z-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" style="background-color: #18392B; color: #C47A3A;">
  <i class="bi bi-list fs-4"></i>
</button>

<!-- Panel Lateral Fijo -->
<div class="offcanvas-lg offcanvas-start sidebar d-flex flex-column" id="sidebarMenu" tabindex="-1">
  
  <div class="p-4 text-center mb-2">
    <a class="text-decoration-none text-white fs-4 fw-bold d-flex flex-column align-items-center" href="{{ url_for('inventario.inventario') }}">
      <i class="bi bi-gear-fill display-5 mb-1" style="color: #C47A3A;"></i>
      <span>Equi-Parts S&S</span>
    </a>
  </div>
  
  <div class="nav flex-column flex-grow-1 px-2 w-100">
    <a class="nav-link py-2 mb-1 {% if request.endpoint == 'inventario.inventario' %}active{% endif %}" href="{{ url_for('inventario.inventario') }}">
      <i class="bi bi-box-seam me-2"></i> Inventario
    </a>
    
    {% if session.get('rol') == 'Administrador' %}
    <a class="nav-link py-2 mb-1 {% if request.endpoint == 'inventario.categorias' %}active{% endif %}" href="{{ url_for('inventario.categorias') }}">
      <i class="bi bi-tags me-2"></i> Categorías
    </a>
    <a class="nav-link py-2 mb-1 {% if request.endpoint == 'reportes.flujo_movimientos' %}active{% endif %}" href="{{ url_for('reportes.flujo_movimientos') }}">
      <i class="bi bi-arrow-left-right me-2"></i> Entradas / Salidas
    </a>
    <a class="nav-link py-2 mb-1 {% if request.endpoint == 'reportes.auditoria' %}active{% endif %}" href="{{ url_for('reportes.auditoria') }}">
      <i class="bi bi-journal-text me-2"></i> Auditoría (Log)
    </a>
    <a class="nav-link py-2 mb-1 {% if request.endpoint == 'usuarios.usuarios' %}active{% endif %}" href="{{ url_for('usuarios.usuarios') }}">
      <i class="bi bi-people me-2"></i> Usuarios
    </a>
    <a class="nav-link py-2 mb-1 {% if request.endpoint == 'reportes.generar_reporte' %}active{% endif %}" href="{{ url_for('reportes.generar_reporte') }}">
      <i class="bi bi-file-earmark-bar-graph me-2"></i> Reportes
    </a>
    {% endif %}
  </div>

  <div class="mt-auto p-3" style="background-color: rgba(0,0,0,0.15);">
    <div class="d-flex align-items-center mb-3 text-white">
      <i class="bi bi-person-circle fs-3 me-2" style="color: #C47A3A;"></i>
      <div class="lh-1">
        <div class="fw-bold">{{ username }}</div>
        <small style="color: #9ca3af;">{{ session.get('rol') }}</small>
      </div>
    </div>
    <a href="{{ url_for('auth.logout') }}" class="btn btn-danger btn-sm w-100">
      <i class="bi bi-box-arrow-right me-1"></i> Salir
    </a>
  </div>
</div>
