{% include 'includes/theme_switcher.html' %}

<!-- Botón de navegación para tablet/móvil -->
<button
  class="btn mobile-menu-button d-lg-none m-3 position-fixed top-0 start-0 z-3"
  type="button"
  data-bs-toggle="offcanvas"
  data-bs-target="#sidebarMenu"
  aria-label="Abrir menú"
>
  <i class="bi bi-list fs-5"></i>
</button>

<!-- Sidebar principal -->
<div class="offcanvas-lg offcanvas-start sidebar d-flex flex-column" id="sidebarMenu" tabindex="-1">
  <div class="sidebar-brand">
    <a class="brand-link" href="{{ url_for('inventario.inventario') }}">
      <span class="brand-icon"><i class="bi bi-gear-wide-connected"></i></span>
      <span>
        <span class="brand-name">Equi-Parts S&S</span>
        <span class="brand-subtitle">Gestión de repuestos</span>
      </span>
    </a>
  </div>

  <div class="nav flex-column flex-grow-1 w-100">
    <div class="sidebar-section-label">Inventario</div>

    <a class="nav-link nav-inventory {% if request.endpoint == 'inventario.inventario' %}active{% endif %}" href="{{ url_for('inventario.inventario') }}">
      <i class="bi bi-box-seam"></i><span>Inventario</span>
    </a>

    {% if session.get('rol') == 'Administrador' %}
    <a class="nav-link nav-categories {% if request.endpoint == 'inventario.categorias' %}active{% endif %}" href="{{ url_for('inventario.categorias') }}">
      <i class="bi bi-tags"></i><span>Categorías</span>
    </a>

    <a class="nav-link nav-movements {% if request.endpoint == 'reportes.flujo_movimientos' %}active{% endif %}" href="{{ url_for('reportes.flujo_movimientos') }}">
      <i class="bi bi-arrow-left-right"></i><span>Entradas / Salidas</span>
    </a>

    <div class="sidebar-section-label">Administración</div>

    <a class="nav-link nav-audit {% if request.endpoint == 'reportes.auditoria' %}active{% endif %}" href="{{ url_for('reportes.auditoria') }}">
      <i class="bi bi-clock-history"></i><span>Auditoría</span>
    </a>

    <a class="nav-link nav-users {% if request.endpoint == 'usuarios.usuarios' %}active{% endif %}" href="{{ url_for('usuarios.usuarios') }}">
      <i class="bi bi-people"></i><span>Usuarios</span>
    </a>

    <a class="nav-link nav-reports {% if request.endpoint == 'reportes.generar_reporte' %}active{% endif %}" href="{{ url_for('reportes.generar_reporte') }}">
      <i class="bi bi-bar-chart"></i><span>Reportes</span>
    </a>
    {% endif %}
  </div>

  <div class="sidebar-user">
    <div class="d-flex align-items-center gap-2">
      <div class="user-avatar"><i class="bi bi-person-fill"></i></div>
      <div class="min-w-0">
        <div class="user-name">{{ username }}</div>
        <div class="user-role">{{ session.get('rol') }}</div>
      </div>
    </div>
    <a href="{{ url_for('auth.logout') }}" class="btn sidebar-logout btn-sm w-100">
      <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
    </a>
  </div>
</div>
