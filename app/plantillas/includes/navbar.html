<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="{{ url_for('inventario.inventario') }}">
          <i class="bi bi-gear-fill"></i>
          Equi-Parts S&S
        </a>
        <div class="navbar-nav me-auto">
          <a class="nav-link {% if request.endpoint == 'inventario.inventario' %}active{% endif %}" href="{{ url_for('inventario.inventario') }}">
            Inventario
          </a>
          
          {% if session.get('rol') == 'Administrador' %}
          <a class="nav-link {% if request.endpoint == 'inventario.categorias' %}active{% endif %}" href="{{ url_for('inventario.categorias') }}">
            Categorías
          </a>
          <a class="nav-link {% if request.endpoint == 'usuarios.usuarios' %}active{% endif %}" href="{{ url_for('usuarios.usuarios') }}">
            Usuarios
          </a>
          
          <a class="nav-link text-warning {% if request.endpoint == 'reportes.auditoria' %}active{% endif %}" href="{{ url_for('reportes.auditoria') }}">
            Auditoría (Log)
          </a>
          
          <a class="nav-link text-danger {% if request.endpoint == 'reportes.generar_reporte' %}active{% endif %}" href="{{ url_for('reportes.generar_reporte') }}">
            Reportes PDF
          </a>
          {% endif %}
        </div>
        
        <form class="d-flex me-3" action="{{ url_for('inventario.inventario') }}" method="GET">
          <div class="input-group">
            <input class="form-control" type="search" name="q" placeholder="Buscar SKU o Nombre" value="{{ busqueda if busqueda else '' }}" />
            <button class="btn btn-outline-light" type="submit">
              <i class="bi bi-search ms-1"></i>
            </button>
          </div>
        </form>
        
        <div class="d-flex align-items-center">
          <div class="usuario-panel text-white me-3 d-flex align-items-center gap-2">
            <i class="bi bi-person-circle fs-4"></i>
            <div>
              <div class="fw-bold lh-1">{{ username }}</div>
              <small class="text-muted">{{ session.get('rol') }}</small>
            </div>
          </div>

          <a href="{{ url_for('auth.logout') }}" class="btn btn-danger">
            <i class="bi bi-box-arrow-right me-1"></i>
            Salir
          </a>
        </div>
      </div>
    </nav>
  </body>
</html>
