<div class="theme-picker" data-theme-switcher>
  <button
    type="button"
    class="theme-picker-trigger"
    data-theme-trigger
    aria-haspopup="true"
    aria-expanded="false"
    aria-label="Cambiar tema de la aplicación"
    title="Cambiar tema"
  >
    <i class="bi bi-sun-fill" data-theme-trigger-icon></i>
    <span data-theme-trigger-label>Claro</span>
    <i class="bi bi-chevron-down theme-picker-chevron"></i>
  </button>

  <div class="theme-picker-menu" role="menu" aria-label="Seleccionar apariencia">
    <div class="theme-picker-heading">
      <span>Apariencia</span>
      <small>Elige cómo quieres ver Equi-Parts</small>
    </div>

    <button type="button" class="theme-option" data-set-theme="light" role="menuitemradio" aria-pressed="true">
      <span class="theme-option-icon theme-option-light"><i class="bi bi-sun-fill"></i></span>
      <span class="theme-option-copy">
        <strong>Claro</strong>
        <small>Limpio y luminoso</small>
      </span>
      <i class="bi bi-check2 theme-option-check"></i>
    </button>

    <button type="button" class="theme-option" data-set-theme="dark" role="menuitemradio" aria-pressed="false">
      <span class="theme-option-icon theme-option-dark"><i class="bi bi-moon-stars-fill"></i></span>
      <span class="theme-option-copy">
        <strong>Oscuro</strong>
        <small>Cómodo en poca luz</small>
      </span>
      <i class="bi bi-check2 theme-option-check"></i>
    </button>
    <div class="theme-picker-heading"><span>Estilo de interfaz</span><small>Original o Material Expressive</small></div>
    <div class="theme-style-row">
      <button type="button" data-set-style="classic">Original</button>
      <button type="button" data-set-style="expressive">Material Expressive</button>
    </div>
    <div class="theme-picker-heading"><span>Color dominante</span><small>Paleta pastel inspirada en Pixel</small></div>
    <div class="theme-colors" aria-label="Elegir color">
      <button type="button" data-set-accent="blue" style="--swatch:#a8c7fa" aria-label="Azul pastel" title="Azul pastel"></button>
      <button type="button" data-set-accent="green" style="--swatch:#a8d5ba" aria-label="Verde pastel" title="Verde pastel"></button>
      <button type="button" data-set-accent="lilac" style="--swatch:#d2bbee" aria-label="Lila pastel" title="Lila pastel"></button>
      <button type="button" data-set-accent="pink" style="--swatch:#f1b9cc" aria-label="Rosa pastel" title="Rosa pastel"></button>
      <button type="button" data-set-accent="peach" style="--swatch:#f6c8a1" aria-label="Durazno pastel" title="Durazno pastel"></button>
    </div>
  </div>
</div>
